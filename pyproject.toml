[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wfn"
version = "0.1.0"
description = "Wind farm noise: wind turbine source model, flow interface and WAPE propagation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "numba>=0.60",
    "pyyaml>=6.0",
    "cattrs>=23.2",
    "joblib>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
explore = ["matplotlib>=3.8", "dash>=2.14", "dash-bootstrap-components>=1.5", "plotly>=5.18"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wfn.source" = ["data/airfoil_geometry/*.dat", "data/turbines/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "xfoil: needs the xfoil executable",
    "legacy: compares against old_project (needs old_project/ in the repo)",
]
