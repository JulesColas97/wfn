# Single input file. Each module reads only its own section:
#   receivers -> wfn.receivers.ReceiversConfig
#   flow      -> wfn.flow.Flow.from_dict
#   source    -> wfn.source.SourceConfig
#   propagation (later) -> wfn.propagation

receivers:
  type: cartesian
  x: {min: -200, max: 200, n: 41}
  y: {min: -200, max: 200, n: 41}
  z: [2]

flow:
  type: uniform
  u: 15.0
  epsilon: 0.01
  shear_alpha: 0.2
  z_ref: 90

source:
  turbine: NREL_5MW                 # package default; or a path to a turbine YAML file
  airfoil_database: ../airfoil_nrel/NREL5MW_14seg_xfoil.nc
  frequencies: [50, 80, 100, 200, 400, 500, 600, 800, 1000, 1200, 1500, 1800, 2000]
  positions: [[0, 0, 90]]
  atmosphere:
    T_ref: 283.15
    rho0: 1.225
  n_jobs: 4
  output: results/nrel
