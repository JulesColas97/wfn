# Single input file. Each module reads only its own section:
#   receivers   -> wfn.receivers.ReceiversConfig
#   propagation -> wfn.propagation.PropagationConfig

receivers:
  type: cartesian
  x: {min: -500, max: 500, n: 500}
  z: {min: -20, max: 200, n: 100}
  y: [0]

flow:
  type: uniform
  u: 15.0
  epsilon: 0.01
  shear_alpha: 0.2
  z_ref: 90

source:
  turbine: input_side_test.yaml                 # package default; or a path to a turbine YAML file
  frequencies: [50, 100] #[50, 80, 100, 200, 400, 500, 600, 800, 1000, 1200, 1500, 1800, 2000]
  positions: [[0, 0, 87.94]]
  atmosphere:
    T_ref: 283.15
    rho0: 1.225
  n_jobs: 4
  output: results/point_source


propagation:
  # path to the compiled Fortran code, or leave it out and set WFN_WAPE
  executable: ../../src/wfn/propagation/EWAPE/2D_EWAPE
  work_dir: results/wape            # t<i>/<int(height)>/ folders + run.sh
  positions: [[0, 0]]
  source_heights: [31, 144]
  tau: [0, 180]
  frequencies: [50, 100, 1000]
  domain: {xmin: -500, xmax: 500, ymin: -500, ymax: 500, zmax: 200}
  output: results/deltaL_side            # results/deltaL_<i>.nc
  backend: ewape
  wape:                             # Fortran namelist parameters
    case_name: c0
    dx_frac: 10
    receiver_heights: [2]
    side: true
    H: 20
    sinus: True
    A_wave: 1.92265 
    lambda_wave: 102.5425
    phi_wave: 0.0
    dx_frac: 2
    dz_frac: 20

wind_turbine:
  seg: [ 66.8]
  chord: [0.47]
  airfoil_index: [6]
  span: [1.4]
  twist: [-4.2]
  airfoil_name: [circular, FX77-W-500, FX77-W-400, DU00-W2-350, DU97-W-300, DU91-W2-250, DU08-W-210]
  airfoil_database: ./MySE3_13seg_xfoil.nc
  hub_height: 87.94
  rotor_diameter: 135.0
  n_blade: 1
  n_beta: 36
  omega_rpm: 12.0
  pitch: 0.0
  yaw_deg: 0.0
